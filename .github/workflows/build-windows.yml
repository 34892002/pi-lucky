name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Neutralino runtime
        run: bun run neu update

      - name: Build application
        run: bun run build

      - name: Verify package contents
        working-directory: dist/pi-lucky
        shell: pwsh
        run: |
          foreach ($file in @('pi-lucky-win_x64.exe', 'resources.neu', 'binaries/pi-lucky-sidecar.exe')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing build output: $file"
            }
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pi-lucky-windows-x64
          path: |
            dist/pi-lucky/pi-lucky-win_x64.exe
            dist/pi-lucky/resources.neu
            dist/pi-lucky/binaries/
          if-no-files-found: error
