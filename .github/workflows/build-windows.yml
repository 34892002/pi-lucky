name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw neutralino.config.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version"
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Neutralino runtime
        run: bun run neu update

      - name: Build application
        run: bun run build

      - name: Verify package contents
        working-directory: dist/pi-lucky
        shell: pwsh
        run: |
          foreach ($file in @('pi-lucky-win_x64.exe', 'resources.neu', 'binaries/pi-lucky-sidecar.exe', 'binaries/photon_rs_bg.wasm')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing build output: $file"
            }
          }

      - name: Verify packaged image resizing
        shell: pwsh
        run: |
          $source = 'node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm'
          # A compiled sidecar may still find the original build-machine path.
          Move-Item -LiteralPath $source -Destination "$source.disabled"
          try {
            & ./dist/pi-lucky/binaries/pi-lucky-sidecar.exe --probe-image-resize
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged sidecar image resize probe failed"
            }
          } finally {
            Move-Item -LiteralPath "$source.disabled" -Destination $source
          }

      - name: Publish GitHub Release
        working-directory: dist/pi-lucky
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "pi-lucky-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -LiteralPath @('pi-lucky-win_x64.exe', 'resources.neu', 'binaries') -DestinationPath $zip
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $zip --verify-tag --generate-notes --title "pi-lucky $env:GITHUB_REF_NAME"
          }
          exit $LASTEXITCODE
